<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <title>Day Planner</title>
    <link rel="stylesheet" href="day-planner.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="/nav.js"></script>
    <script src="task-editor.js"></script>
    <script src="task-creator.js"></script>
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Day Planner</h1>
            <div class="header-actions">
                <button id="save-btn" class="btn btn-primary">
                    <span class="icon">💾</span>
                    Save
                </button>
                <button id="reset-btn" class="btn btn-secondary">
                    <span class="icon">🔄</span>
                    Reset
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left column: day calendar (70%) -->
            <div class="calendar-column">
                <div class="calendar-header">
                    <h2>My Day</h2>
                    <div class="date-display" id="current-date"></div>
                </div>
                <div class="calendar-container">
                    <div class="time-slots" id="time-slots">
                        <!-- Time slots generated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Right column: unscheduled tasks (30%) -->
            <div class="tasks-column">
                <div class="tasks-header">
                    <h2>Tasks to schedule</h2>
                    <div class="tasks-controls">
                        <button id="add-task-btn" class="btn btn-small btn-primary">
                            <span class="icon">➕</span>
                            Add
                        </button>
                        <select id="sort-tasks" class="sort-select">
                            <option value="priority">By priority</option>
                            <option value="duration">By duration</option>
                            <option value="alphabetical">Alphabetical</option>
                        </select>
                    </div>
                </div>

                <div class="tasks-container" id="unplanned-tasks">
                    <!-- Unscheduled tasks added here by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Task editor modal created dynamically by TaskEditor -->
    <!-- Task creator modal created dynamically by TaskCreator -->

    <!-- Drag and drop overlay -->
    <div id="drag-overlay" class="drag-overlay"></div>

    <script src="day-planner.js"></script>
</body>
</html>
