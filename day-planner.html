<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificateur de Journée</title>
    <link rel="stylesheet" href="day-planner.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Planificateur de Journée</h1>
            <div class="header-actions">
                <button id="save-btn" class="btn btn-primary">
                    <span class="icon">💾</span>
                    Sauvegarder
                </button>
                <button id="reset-btn" class="btn btn-secondary">
                    <span class="icon">🔄</span>
                    Réinitialiser
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Colonne de gauche : Calendrier de la journée (70%) -->
            <div class="calendar-column">
                <div class="calendar-header">
                    <h2>Ma Journée</h2>
                    <div class="date-display" id="current-date"></div>
                </div>
                <div class="calendar-container">
                    <div class="time-slots" id="time-slots">
                        <!-- Les créneaux horaires seront générés par JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Colonne de droite : Tâches non planifiées (30%) -->
            <div class="tasks-column">
                <div class="tasks-header">
                    <h2>Tâches à planifier</h2>
                    <div class="tasks-controls">
                        <button id="add-task-btn" class="btn btn-small btn-primary">
                            <span class="icon">➕</span>
                            Ajouter
                        </button>
                        <select id="sort-tasks" class="sort-select">
                            <option value="priority">Par priorité</option>
                            <option value="duration">Par durée</option>
                            <option value="alphabetical">Alphabétique</option>
                        </select>
                    </div>
                </div>
                <div class="tasks-container" id="unplanned-tasks">
                    <!-- Les tâches non planifiées seront ajoutées ici -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pour ajouter/modifier une tâche -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Ajouter une tâche</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Titre de la tâche *</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea id="task-description" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-duration">Durée estimée *</label>
                        <select id="task-duration" required>
                            <option value="">Sélectionner...</option>
                            <option value="15">15 min</option>
                            <option value="30">30 min</option>
                            <option value="45">45 min</option>
                            <option value="60">1h</option>
                            <option value="90">1h30</option>
                            <option value="120">2h</option>
                            <option value="180">3h</option>
                            <option value="240">4h</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-priority">Priorité</label>
                        <select id="task-priority">
                            <option value="low">Faible</option>
                            <option value="medium" selected>Moyenne</option>
                            <option value="high">Élevée</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Sauvegarder</button>
                    <button type="button" class="btn btn-secondary" id="cancel-task">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Overlay pour le drag and drop -->
    <div id="drag-overlay" class="drag-overlay"></div>

    <script src="day-planner.js"></script>
</body>
</html>
