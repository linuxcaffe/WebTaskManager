<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TaskCard Autonomy</title>
    <style>
        .task-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: white;
        }
        .task-priority {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
        }
        .high { background: #ffebee; color: #c62828; }
        .medium { background: #fff3e0; color: #e65100; }
        .low { background: #e8f5e9; color: #2e7d32; }
        .btn {
            padding: 5px 10px;
            margin: 2px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-danger { background: #f44336; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-warning { background: #FF9800; color: white; }
        .btn-small { padding: 3px 6px; font-size: 12px; }
        .task-actions { margin-top: 10px; }
        .task-tag {
            background: #e0e0e0;
            padding: 2px 5px;
            border-radius: 3px;
            margin-right: 5px;
            font-size: 12px;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
        }
        .notification.show {
            display: block;
        }
        .notification.success {
            background: #4CAF50;
            color: white;
        }
        .notification.error {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Test TaskCard Autonomy</h1>
    <div id="tasks-container"></div>
    <div id="notification" class="notification"></div>

    <template id="task-card-minimal">
        <div class="task-card minimal-mode" data-task-id="">
            <div class="task-header">
                <span name="priority" class="task-priority"></span>
                <h3 name="description" class="task-description"></h3>
            </div>
            <div class="task-meta">
                <span name="duration" class="task-duration"></span>
            </div>
        </div>
    </template>

    <template id="task-card-full">
        <div class="task-card full-mode" data-task-id="">
            <div class="task-header">
                <span name="priority" class="task-priority"></span>
                <h3 name="description" class="task-description"></h3>
            </div>
            <div class="task-meta">
                <span name="duration" class="task-duration"></span>
                <span name="due" class="task-due"></span>
            </div>
            <div name="tags" class="task-tags"></div>
            <div name="actions" class="task-actions"></div>
        </div>
    </template>

    <script src="task-card.js"></script>
    <script>
        // Simuler les données de tâche
        const mockTask = {
            uuid: 'test-task-123',
            description: 'Test autonomous task card',
            priority: 'H',
            estTime: 'PT2H30M',
            due: '2025-12-31T23:59:59',
            tags: ['test', 'autonomy'],
            start: false
        };

        // Callback pour les notifications
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Callback pour la suppression
        function handleDelete(taskUuid) {
            console.log('Task deleted:', taskUuid);
            const card = document.querySelector(`.task-card[data-task-id="${taskUuid}"]`);
            if (card) card.remove();
            showNotification('Task deleted successfully', 'success');
        }

        // Callback pour l'édition
        function handleEdit(task) {
            console.log('Edit task:', task);
            showNotification('Edit mode opened', 'success');
        }

        // Callback pour la confirmation de suppression
        function confirmDelete(taskUuid) {
            if (confirm('Delete this task?')) {
                handleDelete(taskUuid);
            }
        }

        // Initialiser le gestionnaire d'actions autonome
        const actionHandler = new TaskActionHandler({
            onTaskDelete: handleDelete,
            onEditRequest: handleEdit,
            onConfirmDelete: confirmDelete,
            showNotification: showNotification
        });

        // Initialiser le gestionnaire de cartes
        const taskCardManager = new TaskCardManager(actionHandler);

        // Créer et afficher la carte de tâche
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('tasks-container');
            const taskCard = taskCardManager.createTaskCard(mockTask, 'full');
            container.appendChild(taskCard);
        });
    </script>
</body>
</html>
