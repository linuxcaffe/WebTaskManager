<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskWarrior Web UI</title>
    <link rel="stylesheet" href="styles.css">
    <script src="nav.js"></script>
    <script src="task-editor.js"></script>
    <script src="task-card.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <div class="container">
        <div class="tasks-section">
            <div class="list-header">
                <h2 id="tasks-heading">Tasks</h2>
                <div class="list-header-right">
                    <span id="filter-badge" class="filter-badge"></span>
                    <button id="view-card" class="view-btn active" title="Card view">⊞</button>
                    <button id="view-list" class="view-btn"        title="List view">≡</button>
                </div>
            </div>
            <div id="loading" class="loading">Loading tasks...</div>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="tasks-container"></div>
        </div>
    </div>

    <!-- Le modal d'édition sera créé dynamiquement par TaskEditor -->

    <div id="notification" class="notification"></div>

</body>
</html>
