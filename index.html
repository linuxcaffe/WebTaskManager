<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskWarrior Web UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>TaskWarrior Web UI</h1>
                <div class="context-selector">
                    <span class="context-label">Context:</span>
                    <div class="context-options">
                        <button type="button" class="context-option" data-context="">All</button>
                        <button type="button" class="context-option" data-context="pro">Pro</button>
                        <button type="button" class="context-option" data-context="perso">Perso</button>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <a href="day-planner.html" class="btn btn-secondary">
                    <span class="icon">📅</span>
                    Planificateur de Journée
                </a>
                <button id="refresh-btn" class="btn btn-primary">
                    <span class="icon">🔄</span>
                    Refresh
                </button>
            </div>
        </header>

        <div class="add-task-section">
            <h2>Add New Task</h2>
            <form id="add-task-form">
                <div class="form-group">
                    <input type="text" id="task-description" placeholder="Task description" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="task-tags" placeholder="Tags (comma-separated)">
                    </div>
                    <div class="form-group">
                        <input type="text" id="task-project" placeholder="Project" list="project-options">
                        <datalist id="project-options"></datalist>
                    </div>
                    <div class="form-group">
                        <select id="task-priority">
                            <option value="">Priority</option>
                            <option value="H">High</option>
                            <option value="M">Medium</option>
                            <option value="L">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-due">Due Date:</label>
                        <input type="datetime-local" id="task-due">
                    </div>
                    <div class="form-group">
                        <label for="task-scheduled">Scheduled:</label>
                        <input type="datetime-local" id="task-scheduled">
                    </div>
                    <div class="form-group">
                        <label for="task-duration">Duration:</label>
                        <input type="text" id="task-duration" placeholder="e.g., 30min, 1h30m, 2d">
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Add Task</button>
            </form>
        </div>

        <div class="filters-section">
            <h2>Advanced Filters</h2>
            <div class="filters-container">
                <div class="form-group">
                    <label for="filter-project">Filter by Project:</label>
                    <input type="text" id="filter-project" placeholder="Enter project name" list="project-suggestions">
                    <datalist id="project-suggestions"></datalist>
                </div>
                <div class="form-group">
                    <label for="filter-tags">Filter by Tag:</label>
                    <input type="text" id="filter-tags" placeholder="Enter tag (comma-separated)">
                </div>
                <button id="apply-filters" class="btn btn-primary">Apply Filters</button>
                <button id="clear-filters" class="btn btn-secondary">Clear Filters</button>
            </div>
        </div>

        <div class="tasks-section">
            <h2>Pending Tasks</h2>
            <div id="loading" class="loading">Loading tasks...</div>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="tasks-container"></div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <span class="close">&times;</span>
            </div>
            <form id="edit-task-form">
                <div class="form-group">
                    <label for="edit-description">Description:</label>
                    <input type="text" id="edit-description" required>
                </div>
                <div class="form-group">
                    <label for="edit-tags">Tags:</label>
                    <input type="text" id="edit-tags" placeholder="Comma-separated tags">
                </div>
                <div class="form-group">
                    <label for="edit-project">Project:</label>
                    <input type="text" id="edit-project" placeholder="Project name">
                </div>
                <div class="form-group">
                    <label for="edit-priority">Priority:</label>
                    <select id="edit-priority">
                        <option value="">None</option>
                        <option value="H">High</option>
                        <option value="M">Medium</option>
                        <option value="L">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-due">Due Date:</label>
                    <input type="datetime-local" id="edit-due">
                </div>
                <div class="form-group">
                    <label for="edit-scheduled">Scheduled:</label>
                    <input type="datetime-local" id="edit-scheduled">
                </div>
                <div class="form-group">
                    <label for="edit-duration">Duration:</label>
                    <input type="text" id="edit-duration" placeholder="e.g., 30min, 1h30m, 2d">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary" id="cancel-edit">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
