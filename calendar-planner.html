<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <title>Calendar Planner</title>

    <!-- Toast UI Calendar CSS - The order is important ! -->
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/calendar/v2.1.3/toastui-calendar.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="calendar-planner.css">
    <script src="/nav.js"></script>
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</head>
<body class="cal-page">
    <div class="app-container">
        <div class="cal-topbar">
            <button id="prev-btn" class="nav-btn">◀</button>
            <span id="calendar-title" class="cal-title-text"></span>
            <div class="cal-topbar-right">
                <button id="today-btn" class="view-btn active">Today</button>
                <button class="view-btn" data-view="day">Day</button>
                <button class="view-btn active" data-view="week">Week</button>
                <button class="view-btn" data-view="month">Month</button>
                <button id="next-btn" class="nav-btn">▶</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Left column: calendar (70%) -->
            <div class="calendar-column">
                <div id="calendar" class="calendar-container"></div>
            </div>

            <!-- Right column: unscheduled tasks (30%) -->
            <div class="tasks-column">
                <div class="tasks-controls">
                    <div class="sort-wrap">
                        <button id="cal-sort-btn" class="view-btn" title="Sort">⇅</button>
                        <div id="cal-sort-popup" class="sort-popup" style="display:none">
                            <div class="sort-fields" id="cal-sort-fields"></div>
                            <label class="sort-reverse-label">
                                <input type="checkbox" id="cal-sort-reverse"> Reverse
                            </label>
                        </div>
                    </div>
                    <button id="cal-view-card" class="view-btn active" title="Card view">⊞</button>
                    <button id="cal-view-list" class="view-btn" title="List view">≡</button>
                </div>
                <div class="tasks-container" id="unplanned-tasks">
                    <div class="loading-message">
                        <span class="icon">⏳</span>
                        Loading tasks...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task detail modal -->
    <div id="task-detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-task-title">Task Details</h3>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modal-task-body">
                <!-- Dynamic content -->
            </div>
            <div class="modal-footer">
                <button id="modal-unschedule-btn" class="btn btn-warning">Unschedule</button>
                <button id="modal-done-btn" class="btn btn-success">Done</button>
                <button id="modal-cancel-btn" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Sync dialog (identical to index.html) -->
    <div id="sync-dialog" class="sync-dialog-backdrop" style="display:none">
        <div class="sync-dialog">
            <div class="sync-dialog-header">
                <span>Sync</span>
                <button id="sync-dialog-close" class="sync-dialog-close">×</button>
            </div>
            <div class="sync-dialog-body">
                <div id="sync-method" class="sync-method"></div>
                <button id="sync-now-btn" class="sync-now-btn">Sync Now</button>
                <pre id="sync-output" class="sync-output" style="display:none"></pre>
            </div>
        </div>
    </div>

    <!-- Notification (same element as index.html so styles.css rules apply) -->
    <div id="notification" class="notification">
        <span id="notif-text"></span>
        <button class="notif-close" id="notif-close">&times;</button>
    </div>

    <!-- Toast UI Calendar JS - The order is important-->
    <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.js"></script>
    <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.js"></script>
    <script src="https://uicdn.toast.com/calendar/v2.1.3/toastui-calendar.min.js"></script>
    <!-- Custom JS -->
    <script src="task-card.js"></script>
    <script src="task-editor.js"></script>
    <script src="calendar-planner.js"></script>
</body>
</html>
